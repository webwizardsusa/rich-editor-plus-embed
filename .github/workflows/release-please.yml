name: release-please

on:
    push:
        branches:
            - main

permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            # Pull requests opened with the built-in GITHUB_TOKEN don't trigger workflows, so a release PR would never
            # get the checks `main` requires. A token of the account's own (RELEASE_PLEASE_TOKEN: a fine-grained
            # personal access token with read and write access to contents, issues and pull requests) does. Without
            # the secret, the built-in token is used and release PRs need an admin merge.
            - uses: googleapis/release-please-action@v4
              with:
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
